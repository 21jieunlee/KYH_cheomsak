<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>금융시사상식 뉴스</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <h1 class="page-title">금융시사상식 뉴스</h1>

    <form id="search-form" class="search-form">
      <input id="search-input" type="text" placeholder="검색어를 입력하세요 (예: 금리)" autocomplete="off" />
      <button type="submit">검색</button>
    </form>

    <div class="chips">
      <button type="button" class="chip" data-keyword="금리">금리</button>
      <button type="button" class="chip" data-keyword="환율">환율</button>
      <button type="button" class="chip" data-keyword="주식">주식</button>
      <button type="button" class="chip" data-keyword="부동산">부동산</button>
      <button type="button" class="chip" data-keyword="금값">금값</button>
    </div>

    <div class="sort-bar">
      <button type="button" class="sort-btn" data-sort="date">최신순</button>
      <button type="button" class="sort-btn" data-sort="sim">정확도순</button>
    </div>

    <div id="state" class="state"></div>
    <div id="results" class="results"></div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/news.js"></script>
</body>
</html>
