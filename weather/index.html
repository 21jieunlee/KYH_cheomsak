<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>랜드마크 날씨 — 세계 각국의 지금</title>
<style>
  :root {
    --card-bg: rgba(255, 255, 255, 0.14);
    --card-border: rgba(255, 255, 255, 0.28);
    --text-main: #ffffff;
    --text-sub: rgba(255, 255, 255, 0.72);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text-main);
  }

  body {
    min-height: 100vh;
    background: linear-gradient(160deg, #4a90d9, #7ec8e3);
    transition: background 1.4s ease;
    overflow-x: hidden;
    position: relative;
  }

  /* ---------- 배경 테마 (날씨 그룹 × 낮/밤) ---------- */
  body.theme-clear-day     { background: linear-gradient(160deg, #4a90d9 0%, #8fd3f4 55%, #ffe9a8 100%); }
  body.theme-clear-night   { background: linear-gradient(160deg, #050a24 0%, #0d1b42 55%, #1c2c5c 100%); }
  body.theme-cloudy-day    { background: linear-gradient(160deg, #7c8fa6 0%, #a9b7c6 55%, #cfd8e0 100%); }
  body.theme-cloudy-night  { background: linear-gradient(160deg, #10141c 0%, #232b3a 55%, #333d50 100%); }
  body.theme-fog-day       { background: linear-gradient(160deg, #a8b0b8 0%, #c7cdd2 60%, #dfe3e6 100%); }
  body.theme-fog-night     { background: linear-gradient(160deg, #1a1d21 0%, #2b2f34 60%, #3c4147 100%); }
  body.theme-rain-day      { background: linear-gradient(160deg, #445b71 0%, #5c7a92 55%, #7c96a8 100%); }
  body.theme-rain-night    { background: linear-gradient(160deg, #060b12 0%, #0f1c2b 55%, #1a2c3e 100%); }
  body.theme-snow-day      { background: linear-gradient(160deg, #9fb4c7 0%, #d3e2ee 55%, #f3f7fb 100%); }
  body.theme-snow-night    { background: linear-gradient(160deg, #131a28 0%, #263349 55%, #3a4a63 100%); }
  body.theme-thunder-day   { background: linear-gradient(160deg, #2c2740 0%, #453b5c 55%, #5c4f74 100%); }
  body.theme-thunder-night { background: linear-gradient(160deg, #08060f 0%, #170f28 55%, #241a3b 100%); }

  /* ---------- 배경 효과 레이어 ---------- */
  .bg-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  /* 맑은 낮: 은은한 태양 광선 */
  .effect-sun {
    position: absolute;
    top: -20%;
    right: -10%;
    width: 60vmax;
    height: 60vmax;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,247,214,0.9) 0%, rgba(255,247,214,0.35) 35%, rgba(255,247,214,0) 70%);
    animation: pulse 6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.85; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.06); }
  }

  /* 맑은 밤: 별 */
  .effect-stars {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 20%, #fff 100%, transparent 0),
      radial-gradient(1.5px 1.5px at 25% 65%, #fff 100%, transparent 0),
      radial-gradient(1px 1px at 40% 15%, #fff 100%, transparent 0),
      radial-gradient(1.5px 1.5px at 55% 80%, #fff 100%, transparent 0),
      radial-gradient(1px 1px at 70% 35%, #fff 100%, transparent 0),
      radial-gradient(1.5px 1.5px at 85% 55%, #fff 100%, transparent 0),
      radial-gradient(1px 1px at 92% 20%, #fff 100%, transparent 0),
      radial-gradient(1.5px 1.5px at 15% 90%, #fff 100%, transparent 0),
      radial-gradient(1px 1px at 60% 5%, #fff 100%, transparent 0),
      radial-gradient(1.5px 1.5px at 33% 45%, #fff 100%, transparent 0);
    background-repeat: no-repeat;
    animation: twinkle 3.2s ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    0% { opacity: 0.35; }
    100% { opacity: 0.95; }
  }

  /* 구름: 떠다니는 흐릿한 덩어리 */
  .effect-clouds::before,
  .effect-clouds::after {
    content: "";
    position: absolute;
    top: 12%;
    width: 55vmax;
    height: 20vmax;
    background: radial-gradient(ellipse, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 70%);
    filter: blur(4px);
    animation: driftClouds 34s linear infinite;
  }
  .effect-clouds::after {
    top: 45%;
    width: 40vmax;
    height: 16vmax;
    animation-duration: 46s;
    animation-delay: -12s;
    opacity: 0.7;
  }
  @keyframes driftClouds {
    from { transform: translateX(-40vmax); }
    to   { transform: translateX(140vmax); }
  }

  /* 안개 */
  .effect-fog::before,
  .effect-fog::after {
    content: "";
    position: absolute;
    left: -20%;
    width: 140%;
    height: 40%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
    filter: blur(6px);
    animation: driftFog 22s ease-in-out infinite;
  }
  .effect-fog::before { top: 20%; }
  .effect-fog::after { top: 60%; animation-duration: 28s; animation-delay: -6s; opacity: 0.7; }
  @keyframes driftFog {
    0%, 100% { transform: translateX(-6%); }
    50% { transform: translateX(6%); }
  }

  /* 비 / 소나기 */
  .effect-rain {
    position: absolute;
    inset: -10% -10%;
    background-image: repeating-linear-gradient(
      100deg,
      rgba(255,255,255,0.55) 0px,
      rgba(255,255,255,0.55) 1.5px,
      transparent 1.5px,
      transparent 22px
    );
    background-size: 100% 140%;
    animation: fallRain 0.55s linear infinite;
    opacity: 0.55;
  }
  @keyframes fallRain {
    from { background-position: 0 -140%; }
    to   { background-position: -12% 0%; }
  }

  /* 눈 */
  .effect-snow {
    position: absolute;
    inset: -10% -10%;
    background-image:
      radial-gradient(2.4px 2.4px at 10% 0%, #fff 100%, transparent 0),
      radial-gradient(2px 2px at 30% 0%, #fff 100%, transparent 0),
      radial-gradient(2.6px 2.6px at 50% 0%, #fff 100%, transparent 0),
      radial-gradient(2px 2px at 70% 0%, #fff 100%, transparent 0),
      radial-gradient(2.4px 2.4px at 90% 0%, #fff 100%, transparent 0);
    background-repeat: repeat-y;
    background-size: 100% 26vmax;
    animation: fallSnow 9s linear infinite;
    opacity: 0.9;
  }
  @keyframes fallSnow {
    from { background-position: 0 -26vmax; }
    to   { background-position: 6% 100%; }
  }

  /* 뇌우: 비 + 번쩍임 */
  .effect-thunder .effect-rain { opacity: 0.65; }
  .effect-flash {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    animation: flash 6.5s ease-in-out infinite;
  }
  @keyframes flash {
    0%, 92%, 100% { opacity: 0; }
    93% { opacity: 0.5; }
    94% { opacity: 0.05; }
    95% { opacity: 0.35; }
    96% { opacity: 0; }
  }

  /* ---------- 레이아웃 ---------- */
  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 60px;
  }

  header.site-header {
    text-align: center;
    margin-bottom: 28px;
  }
  header.site-header h1 {
    margin: 0 0 6px;
    font-size: clamp(22px, 4vw, 32px);
    letter-spacing: -0.02em;
  }
  header.site-header p {
    margin: 0;
    color: var(--text-sub);
    font-size: 14px;
  }

  .landmark-grid {
    width: 100%;
    max-width: 980px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 30px;
  }

  .landmark-card {
    appearance: none;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    color: var(--text-main);
    border-radius: 14px;
    padding: 14px 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  .landmark-card:hover {
    transform: translateY(-3px);
    background: rgba(255,255,255,0.22);
  }
  .landmark-card:active { transform: translateY(0); }
  .landmark-card.active {
    background: rgba(255,255,255,0.32);
    box-shadow: 0 0 0 2px rgba(255,255,255,0.85) inset;
  }
  .landmark-card .emoji { font-size: 26px; }
  .landmark-card .name { font-size: 13.5px; font-weight: 600; text-align: center; }
  .landmark-card .country { font-size: 11.5px; color: var(--text-sub); }

  .info-card {
    width: 100%;
    max-width: 480px;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 22px;
    padding: 26px 28px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
  }

  .info-card .landmark-title {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 2px;
  }
  .info-card .landmark-country {
    color: var(--text-sub);
    font-size: 14px;
    margin: 0 0 18px;
  }

  .info-main {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-bottom: 16px;
  }
  .weather-icon { font-size: 52px; line-height: 1; }
  .temperature { font-size: 44px; font-weight: 700; }
  .temperature .unit { font-size: 22px; font-weight: 500; vertical-align: top; }

  .weather-desc { font-size: 15px; color: var(--text-sub); margin: 0 0 18px; }

  .info-sub {
    display: flex;
    justify-content: center;
    gap: 26px;
    border-top: 1px solid var(--card-border);
    padding-top: 16px;
  }
  .info-sub .block { text-align: center; }
  .info-sub .label { font-size: 11.5px; color: var(--text-sub); margin-bottom: 4px; letter-spacing: 0.02em; }
  .info-sub .value { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }

  .status-msg {
    font-size: 14px;
    color: var(--text-sub);
    min-height: 20px;
    margin-top: 6px;
  }
  .status-msg.error { color: #ffd0d0; }

  footer.site-footer {
    margin-top: 36px;
    font-size: 12px;
    color: var(--text-sub);
    text-align: center;
  }

  @media (max-width: 480px) {
    .info-card { padding: 20px 18px; }
    .info-sub { gap: 14px; }
    .temperature { font-size: 36px; }
    .weather-icon { font-size: 42px; }
  }
</style>
</head>
<body>

  <div class="bg-layer" id="bgLayer"></div>

  <div class="page">
    <header class="site-header">
      <h1>🌍 랜드마크 날씨</h1>
      <p>세계 각국의 랜드마크를 눌러 지금 이 순간의 날씨와 시각을 확인해보세요</p>
    </header>

    <div class="landmark-grid" id="landmarkGrid"></div>

    <section class="info-card">
      <h2 class="landmark-title" id="landmarkTitle">—</h2>
      <p class="landmark-country" id="landmarkCountry">—</p>

      <div class="info-main">
        <div class="weather-icon" id="weatherIcon">⛅</div>
        <div class="temperature"><span id="temperature">--</span><span class="unit">°C</span></div>
      </div>
      <p class="weather-desc" id="weatherDesc">날씨 정보를 불러오는 중...</p>

      <div class="info-sub">
        <div class="block">
          <div class="label">현지 시각</div>
          <div class="value" id="localTime">--:--:--</div>
        </div>
        <div class="block">
          <div class="label">현지 날짜</div>
          <div class="value" id="localDate">----.--.--</div>
        </div>
      </div>

      <p class="status-msg" id="statusMsg"></p>
    </section>

    <footer class="site-footer">
      날씨 데이터 제공: <a href="https://open-meteo.com/" target="_blank" rel="noopener" style="color: inherit;">Open-Meteo</a>
    </footer>
  </div>

<script>
(function () {
  "use strict";

  // ---------- 1. 랜드마크 데이터 (PRD 8장) ----------
  const LANDMARKS = [
    { id: "eiffel",    name: "에펠탑",            country: "프랑스",     lat: 48.8584,  lon: 2.2945,   emoji: "🗼" },
    { id: "liberty",   name: "자유의 여신상",      country: "미국",       lat: 40.6892,  lon: -74.0445, emoji: "🗽" },
    { id: "tokyo",     name: "도쿄타워",          country: "일본",       lat: 35.6586,  lon: 139.7454, emoji: "🎌" },
    { id: "bigben",    name: "빅벤",              country: "영국",       lat: 51.5007,  lon: -0.1246,  emoji: "🕰️" },
    { id: "sydney",    name: "시드니 오페라하우스", country: "호주",       lat: -33.8568, lon: 151.2153, emoji: "🎭" },
    { id: "colosseum", name: "콜로세움",          country: "이탈리아",   lat: 41.8902,  lon: 12.4922,  emoji: "🏛️" },
    { id: "greatwall", name: "만리장성",          country: "중국",       lat: 40.4319,  lon: 116.5704, emoji: "🐉" },
    { id: "pyramid",   name: "피라미드(기자)",     country: "이집트",     lat: 29.9792,  lon: 31.1342,  emoji: "🔺" },
    { id: "tajmahal",  name: "타지마할",          country: "인도",       lat: 27.1751,  lon: 78.0421,  emoji: "🕌" },
    { id: "corcovado", name: "크리스토 레덴토르",   country: "브라질",     lat: -22.9519, lon: -43.2105, emoji: "🌄" },
    { id: "burj",      name: "부르즈 할리파",      country: "UAE",       lat: 25.1972,  lon: 55.2744,  emoji: "🏙️" },
    { id: "namsan",    name: "남산타워",          country: "대한민국",   lat: 37.5512,  lon: 126.9882, emoji: "📡" }
  ];

  const DEFAULT_LANDMARK_ID = "eiffel";
  const CACHE_TTL_MS = 3 * 60 * 1000; // 3분 캐싱

  // ---------- 2. 날씨 코드 → 그룹 매핑 (PRD 5.3, 6장) ----------
  function weatherGroupFromCode(code) {
    if (code === 0) return "clear";
    if (code >= 1 && code <= 3) return "cloudy";
    if (code === 45 || code === 48) return "fog";
    if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return "rain";
    if (code >= 71 && code <= 77) return "snow";
    if (code >= 95 && code <= 99) return "thunder";
    return "cloudy";
  }

  const WEATHER_LABEL = {
    clear: "맑음",
    cloudy: "구름 많음",
    fog: "안개",
    rain: "비",
    snow: "눈",
    thunder: "뇌우"
  };

  const WEATHER_ICON = {
    clear:   { day: "☀️", night: "🌙" },
    cloudy:  { day: "⛅", night: "☁️" },
    fog:     { day: "🌫️", night: "🌫️" },
    rain:    { day: "🌧️", night: "🌧️" },
    snow:    { day: "❄️", night: "❄️" },
    thunder: { day: "⛈️", night: "⛈️" }
  };

  // ---------- 3. 상태 ----------
  const cache = new Map(); // landmarkId -> { data, fetchedAt }
  let clockTimer = null;
  let currentLandmarkId = null;

  // ---------- 4. DOM ----------
  const grid = document.getElementById("landmarkGrid");
  const bgLayer = document.getElementById("bgLayer");
  const els = {
    title: document.getElementById("landmarkTitle"),
    country: document.getElementById("landmarkCountry"),
    icon: document.getElementById("weatherIcon"),
    temp: document.getElementById("temperature"),
    desc: document.getElementById("weatherDesc"),
    time: document.getElementById("localTime"),
    date: document.getElementById("localDate"),
    status: document.getElementById("statusMsg")
  };

  // ---------- 5. 카드 렌더링 ----------
  LANDMARKS.forEach((lm) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "landmark-card";
    btn.dataset.id = lm.id;
    btn.innerHTML =
      '<span class="emoji">' + lm.emoji + '</span>' +
      '<span class="name">' + lm.name + '</span>' +
      '<span class="country">' + lm.country + '</span>';
    btn.addEventListener("click", () => selectLandmark(lm.id));
    grid.appendChild(btn);
  });

  function setActiveCard(id) {
    grid.querySelectorAll(".landmark-card").forEach((card) => {
      card.classList.toggle("active", card.dataset.id === id);
    });
  }

  // ---------- 6. 날씨 조회 (캐싱 포함) ----------
  async function fetchWeather(landmark) {
    const cached = cache.get(landmark.id);
    if (cached && Date.now() - cached.fetchedAt < CACHE_TTL_MS) {
      return cached.data;
    }

    const url =
      "https://api.open-meteo.com/v1/forecast" +
      "?latitude=" + landmark.lat +
      "&longitude=" + landmark.lon +
      "&current_weather=true&timezone=auto";

    const res = await fetch(url);
    if (!res.ok) throw new Error("weather fetch failed");
    const data = await res.json();
    cache.set(landmark.id, { data, fetchedAt: Date.now() });
    return data;
  }

  // ---------- 7. 현지 시각 표시 (PRD 5.4: 1초마다 클라이언트에서 흐름) ----------
  function parseLocalTimeString(timeStr) {
    // "YYYY-MM-DDTHH:MM" 형태의 현지 naive 시각 문자열
    const [datePart, timePart] = timeStr.split("T");
    const [y, mo, d] = datePart.split("-").map(Number);
    const [h, mi] = timePart.split(":").map(Number);
    return new Date(Date.UTC(y, mo - 1, d, h, mi, 0));
  }

  function pad(n) { return String(n).padStart(2, "0"); }

  function startClock(baseLocalTime) {
    if (clockTimer) clearInterval(clockTimer);
    const fetchedAtMs = Date.now();

    function tick() {
      const elapsedSec = Math.floor((Date.now() - fetchedAtMs) / 1000);
      const current = new Date(baseLocalTime.getTime() + elapsedSec * 1000);
      els.time.textContent =
        pad(current.getUTCHours()) + ":" + pad(current.getUTCMinutes()) + ":" + pad(current.getUTCSeconds());
      els.date.textContent =
        current.getUTCFullYear() + "." + pad(current.getUTCMonth() + 1) + "." + pad(current.getUTCDate());
    }

    tick();
    clockTimer = setInterval(tick, 1000);
  }

  // ---------- 8. 배경 테마 전환 ----------
  function applyTheme(group, isDay) {
    const dayNight = isDay ? "day" : "night";
    const themeClass = "theme-" + group + "-" + dayNight;

    document.body.className = themeClass;

    let effectHtml = "";
    if (group === "clear") {
      effectHtml = isDay ? '<div class="effect-sun"></div>' : '<div class="effect-stars"></div>';
    } else if (group === "cloudy") {
      effectHtml = '<div class="effect-clouds"></div>';
    } else if (group === "fog") {
      effectHtml = '<div class="effect-fog"></div>';
    } else if (group === "rain") {
      effectHtml = '<div class="effect-rain"></div>';
    } else if (group === "snow") {
      effectHtml = '<div class="effect-snow"></div>';
    } else if (group === "thunder") {
      effectHtml = '<div class="effect-thunder"><div class="effect-rain"></div></div><div class="effect-flash"></div>';
    }
    bgLayer.innerHTML = effectHtml;
  }

  // ---------- 9. 랜드마크 선택 ----------
  async function selectLandmark(id) {
    const landmark = LANDMARKS.find((lm) => lm.id === id);
    if (!landmark) return;

    currentLandmarkId = id;
    setActiveCard(id);

    els.title.textContent = landmark.name;
    els.country.textContent = landmark.country;
    els.status.textContent = "불러오는 중...";
    els.status.classList.remove("error");

    try {
      const data = await fetchWeather(landmark);

      // 선택이 바뀐 사이 응답이 늦게 온 경우 무시
      if (currentLandmarkId !== id) return;

      const cw = data.current_weather;
      const group = weatherGroupFromCode(cw.weathercode);
      const isDay = cw.is_day === 1;

      els.icon.textContent = WEATHER_ICON[group][isDay ? "day" : "night"];
      els.temp.textContent = Math.round(cw.temperature);
      els.desc.textContent = WEATHER_LABEL[group] + (isDay ? " · 낮" : " · 밤");
      els.status.textContent = "";

      startClock(parseLocalTimeString(cw.time));
      applyTheme(group, isDay);
    } catch (err) {
      if (currentLandmarkId !== id) return;
      els.status.textContent = "잠시 후 다시 시도해주세요.";
      els.status.classList.add("error");
    }
  }

  // ---------- 10. 초기 진입 ----------
  selectLandmark(DEFAULT_LANDMARK_ID);
})();
</script>

</body>
</html>
