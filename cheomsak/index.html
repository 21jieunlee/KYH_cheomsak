<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>첨삭진 관리 - 김윤환입시연구소</title>
<style>
  :root {
    --primary: #1b2a4a;
    --primary-press: #111b30;
    --on-primary: #ffffff;
    --ink: #1d1d1d;
    --ink-mute: #696969;
    --canvas: #ffffff;
    --canvas-lavender: #f2f4f7;
    --hairline: #e2e5ea;
    --error: #dc2626;
    --success: #16a34a;
    --spacing-xs: 4px;
    --spacing-sm: 8px;
    --spacing-md: 12px;
    --spacing-lg: 20px;
    --spacing-huge: 28px;
    --rounded-sm: 4px;
    --rounded-pill: 90px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    background: var(--canvas-lavender);
    color: var(--ink);
    padding-top: 70px;
  }

  /* Topbar */
  .app-topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(27, 42, 74, 0.12);
  }

  .app-header {
    background: var(--primary);
    color: var(--on-primary);
    text-align: center;
    padding: 18px 16px;
    font-size: 27px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .app-nav {
    display: flex;
    align-items: center;
    background: var(--primary-press);
    padding: 6px 12px;
    gap: 4px;
    overflow-x: auto;
  }

  .app-nav.hidden { display: none; }

  .nav-btn {
    border: none;
    background: transparent;
    color: var(--on-primary);
    opacity: 0.75;
    font-size: 14px;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: var(--rounded-pill);
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 200ms ease, opacity 200ms ease;
  }

  .nav-btn.active {
    opacity: 1;
    background: rgba(255, 255, 255, 0.15);
  }

  .nav-logout {
    margin-left: auto;
    border: none;
    background: transparent;
    color: var(--on-primary);
    opacity: 0.55;
    font-size: 12px;
    font-weight: 400;
    cursor: pointer;
    padding: 8px;
    white-space: nowrap;
  }

  /* Screens */
  .screen { display: none; padding: 24px 16px 60px; }
  .screen.active { display: block; }
  .hidden { display: none !important; }

  .card {
    max-width: 360px;
    margin: 0 auto;
    background: var(--canvas);
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 4px 16px rgba(27, 42, 74, 0.10);
  }

  .card--wide { max-width: 640px; }
  .card--calendar { max-width: 1200px; }

  .card h2, .card h3 { margin-bottom: var(--spacing-lg); }
  .subtitle { color: var(--ink-mute); font-size: 13px; }

  /* Form elements */
  .field { margin-bottom: var(--spacing-lg); }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: var(--spacing-xs);
    color: var(--ink-mute);
  }

  .search-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--hairline);
    border-radius: var(--rounded-sm);
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
    background: var(--canvas);
  }

  textarea.search-input { min-height: 90px; resize: vertical; }

  .pin-row { display: flex; gap: var(--spacing-sm); }
  .pin-input {
    width: 48px;
    height: 48px;
    text-align: center;
    font-size: 20px;
    border: 1px solid var(--hairline);
    border-radius: var(--rounded-sm);
  }

  .error-message {
    color: var(--error);
    font-size: 13px;
    min-height: 18px;
    margin-bottom: var(--spacing-sm);
  }

  .btn {
    width: 100%;
    min-height: 44px;
    border: none;
    border-radius: var(--rounded-sm);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: var(--spacing-sm);
    transition: background-color 200ms ease, transform 150ms ease;
  }

  .btn:not(:disabled):active { transform: scale(0.98); }

  .btn-primary { background: var(--primary); color: var(--on-primary); }
  .btn-primary:disabled { background: var(--hairline); color: var(--ink-mute); cursor: not-allowed; }
  .btn-primary:not(:disabled):hover { background: var(--primary-press); }
  .btn-secondary { background: var(--canvas-lavender); color: var(--ink); border: 1px solid var(--hairline); }

  .form-actions { display: flex; gap: var(--spacing-sm); }
  .form-actions .btn { width: auto; flex: 1; margin-bottom: 0; }

  /* Week navigation */
  .week-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--spacing-lg);
  }

  .week-nav-label { font-size: 14px; font-weight: 700; color: var(--ink); }

  .week-nav-btn {
    border: 1px solid var(--hairline);
    background: var(--canvas);
    color: var(--ink);
    font-size: 13px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: var(--rounded-sm);
    cursor: pointer;
  }

  .week-nav-btn:disabled { color: var(--ink-mute); cursor: not-allowed; opacity: 0.5; }

  /* Receipt rows (my-schedule receipt panel) */
  .receipt-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-sm);
    padding: var(--spacing-sm) 0;
    border-bottom: 1px solid var(--hairline);
    font-size: 13px;
  }

  .receipt-row:last-child { border-bottom: none; }
  .receipt-row-name { font-weight: 700; white-space: nowrap; }
  .receipt-row-meta { color: var(--ink-mute); font-size: 12px; flex: 1; margin-left: var(--spacing-sm); }

  .receipt-row-remove {
    flex-shrink: 0;
    border: none;
    background: none;
    color: var(--ink-mute);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    padding: 4px 6px;
  }

  .receipt-row-remove:hover { color: var(--error); }

  /* Week calendar */
  .week-calendar {
    display: grid;
    grid-template-columns: repeat(7, minmax(150px, 1fr));
    gap: var(--spacing-md);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 4px;
    -webkit-mask-image: linear-gradient(to right, black calc(100% - 16px), transparent 100%);
    mask-image: linear-gradient(to right, black calc(100% - 16px), transparent 100%);
  }

  .week-calendar::-webkit-scrollbar { height: 6px; }
  .week-calendar::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: var(--rounded-sm); }

  .week-day-header {
    text-align: center;
    font-weight: 700;
    font-size: 14px;
    color: var(--ink-mute);
    margin-bottom: var(--spacing-sm);
  }

  .week-day-empty {
    text-align: center;
    color: var(--ink-mute);
    font-size: 12px;
    padding: var(--spacing-md) 0;
  }

  .class-card {
    background: var(--canvas-lavender);
    border-radius: var(--rounded-sm);
    padding: var(--spacing-md);
    margin-bottom: var(--spacing-sm);
    border: 1px solid transparent;
    transition: border-color 200ms ease;
  }

  .class-card--editable { cursor: pointer; }
  .class-card--editable:hover { border-color: var(--hairline); }
  .class-card--active { border-color: var(--primary); border-width: 2px; }

  .class-card .class-name { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
  .class-card .class-location { font-size: 12px; color: var(--ink-mute); }
  .class-card .class-time { font-size: 12px; color: var(--ink-mute); margin-bottom: var(--spacing-xs); }
  .class-card .class-meta { font-size: 12px; margin-bottom: 2px; }
  .class-card .class-teachers { font-size: 12px; font-weight: 400; color: var(--primary); }
  .class-card .class-teachers strong { font-weight: 700; }

  .receipt-status-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: var(--rounded-pill);
    margin-bottom: var(--spacing-xs);
  }

  .receipt-status-badge--done { background: rgba(22, 163, 74, 0.12); color: var(--success); }
  .receipt-status-badge--pending { background: rgba(220, 38, 38, 0.10); color: var(--error); }

  .home-edit-panel {
    margin-top: var(--spacing-lg);
    background: var(--canvas-lavender);
    border-radius: var(--rounded-sm);
    padding: var(--spacing-lg);
  }

  .home-edit-panel h4 { margin-bottom: var(--spacing-md); font-size: 15px; }

  /* Notices */
  .notice-form { margin-bottom: var(--spacing-huge); }

  .notice-item {
    border-bottom: 1px solid var(--hairline);
    padding: var(--spacing-md) 0;
  }

  .notice-item h4 { font-size: 15px; margin-bottom: var(--spacing-xs); }
  .notice-item p { font-size: 13px; color: var(--ink); margin-bottom: var(--spacing-xs); white-space: pre-wrap; }
  .notice-meta { font-size: 12px; color: var(--ink-mute); }

  .notice-actions {
    display: flex;
    gap: var(--spacing-sm);
    margin-top: var(--spacing-sm);
  }

  .notice-actions .btn {
    width: auto;
    flex: 1;
    min-height: 36px;
    padding: 8px 16px;
    font-size: 13px;
    margin-bottom: 0;
  }

  /* Receipts */
  .receipt-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .receipt-table th, .receipt-table td {
    text-align: left;
    padding: var(--spacing-sm) var(--spacing-md);
    border-bottom: 1px solid var(--hairline);
  }
  .receipt-table th { color: var(--ink-mute); font-weight: 700; }
</style>
</head>
<body>

<div class="app-topbar">
  <header class="app-header">김윤환입시연구소 논술첨삭팀</header>
  <nav class="app-nav hidden" id="appNav">
    <button type="button" class="nav-btn" data-screen="screen-home">홈</button>
    <button type="button" class="nav-btn" data-screen="screen-notice">공지사항</button>
    <button type="button" class="nav-btn" data-screen="screen-my-schedule">내 시간표</button>
    <button type="button" class="nav-btn" data-screen="screen-receipts">수령 현황</button>
    <button type="button" class="nav-logout" id="logoutBtn">로그아웃</button>
  </nav>
</div>

<main>

<div id="screen-login" class="screen active">
  <div class="card">
    <h2>로그인</h2>
    <form id="loginForm">
      <div class="field">
        <label for="nameInput">이름</label>
        <input type="text" id="nameInput" class="search-input" placeholder="이름을 입력하세요" autocomplete="off" required>
      </div>
      <div class="field">
        <label>PIN (4자리)</label>
        <div class="pin-row">
          <input type="password" maxlength="1" inputmode="numeric" class="pin-input" data-pin-index="0">
          <input type="password" maxlength="1" inputmode="numeric" class="pin-input" data-pin-index="1">
          <input type="password" maxlength="1" inputmode="numeric" class="pin-input" data-pin-index="2">
          <input type="password" maxlength="1" inputmode="numeric" class="pin-input" data-pin-index="3">
        </div>
      </div>
      <p class="error-message" id="errorMessage"></p>
      <button type="submit" class="btn btn-primary" id="loginBtn" disabled>로그인</button>
    </form>
  </div>
</div>

<div id="screen-home" class="screen">
  <div class="card card--calendar">
    <h3 id="homeGreeting">이번 주 수업</h3>
    <div class="week-calendar" id="weekCalendar"></div>
    <div class="home-edit-panel hidden" id="homeEditPanel"></div>
  </div>
</div>

<div id="screen-notice" class="screen">
  <div class="card card--wide">
    <h3>공지사항</h3>
    <div class="notice-form hidden" id="noticeForm">
      <div class="field">
        <label for="noticeTitleInput">제목</label>
        <input type="text" class="search-input" id="noticeTitleInput">
      </div>
      <div class="field">
        <label for="noticeContentInput">내용</label>
        <textarea class="search-input" id="noticeContentInput"></textarea>
      </div>
      <button type="button" class="btn btn-primary" id="addNoticeBtn">등록</button>
    </div>
    <div id="noticeListContainer"></div>
  </div>
</div>

<div id="screen-my-schedule" class="screen">
  <div class="card card--calendar">
    <h3>내 시간표</h3>
    <div class="week-nav" id="myScheduleWeekNav"></div>
    <div class="week-calendar" id="myScheduleCalendar"></div>
    <div class="home-edit-panel hidden" id="myScheduleReceiptPanel"></div>
  </div>
</div>

<div id="screen-receipts" class="screen">
  <div class="card card--wide">
    <h3>수령 현황</h3>
    <div class="field">
      <label for="receiptDateSelect">날짜</label>
      <input type="date" class="search-input" id="receiptDateSelect">
    </div>
    <div class="field">
      <label for="receiptClassSelect">수업</label>
      <select class="search-input" id="receiptClassSelect" disabled>
        <option value="">날짜를 먼저 선택하세요</option>
      </select>
    </div>
    <div class="field">
      <label for="receiptSearchInput">학생 이름 검색</label>
      <input type="text" class="search-input" id="receiptSearchInput" placeholder="학생 이름으로 검색" autocomplete="off">
    </div>
    <div id="receiptsContainer"></div>
  </div>
</div>

</main>

  const WEEKDAYS = ['월', '화', '수', '목', '금', '토', '일'];
  let editingClassId = null;

  // ---------- Date helpers (real week calendar) ----------
  function getMondayOfWeek(baseDate) {
    const day = baseDate.getDay(); // 0=Sun..6=Sat
    const diffToMonday = (day === 0) ? -6 : 1 - day;
    const monday = new Date(baseDate);
    monday.setHours(0, 0, 0, 0);
    monday.setDate(baseDate.getDate() + diffToMonday);
    return monday;
  }

  function buildWeekDates(monday) {
    const dates = {};
    WEEKDAYS.forEach((label, idx) => {
      const d = new Date(monday);
      d.setDate(monday.getDate() + idx);
      dates[label] = d;
    });
    return dates;
  }

  function formatDateLabel(d) {
    return `${d.getMonth() + 1}/${d.getDate()}`;
  }

  function formatDateKey(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function parseDateInputValue(value) {
    const [y, m, d] = value.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function weekdayLabelOf(date) {
    return ['일', '월', '화', '수', '목', '금', '토'][date.getDay()];
  }

  function formatTimestampLabel(d) {
    const h = String(d.getHours()).padStart(2, '0');
    const min = String(d.getMinutes()).padStart(2, '0');
    return `${formatDateLabel(d)} ${h}:${min}`;
  }

  function getReceiptsForClassDate(cls, dateObj) {
    const dateLabel = formatDateLabel(dateObj);
    return receiptsData.filter(r => r.className === cls.className && r.date === dateLabel);
  }

  // 시간표가 고정되어 있는 기간: 8/3 ~ 9/13 (해당 기간 내 주 단위로만 이동 가능)
  const SCHEDULE_RANGE_YEAR = new Date().getFullYear();
  const SCHEDULE_MIN_DATE = new Date(SCHEDULE_RANGE_YEAR, 7, 3);
  const SCHEDULE_MAX_DATE = new Date(SCHEDULE_RANGE_YEAR, 8, 13);
  const MIN_WEEK_MONDAY = getMondayOfWeek(SCHEDULE_MIN_DATE);
  const MAX_WEEK_MONDAY = getMondayOfWeek(SCHEDULE_MAX_DATE);

  // 8/15부터 classesData(18차) 패턴 적용, 그 이전(8/3~8/14)은 classesData15ch(15차) 패턴 적용
  const SCHEDULE_SPLIT_DATE = new Date(SCHEDULE_RANGE_YEAR, 7, 15);

  function findClassById(id) {
    return classesData.find(c => c.id === id) || classesData15ch.find(c => c.id === id);
  }

  function getMyClassesForWeek(weekDates) {
    const result = [];
    WEEKDAYS.forEach(day => {
      const dateObj = weekDates[day];
      const source = dateObj < SCHEDULE_SPLIT_DATE ? classesData15ch : classesData;
      source
        .filter(cls => cls.day === day
          && cls.teachers.some(t => t.replace(/\s*\(책임\)\s*$/, '') === currentUser.name))
        .forEach(cls => result.push(cls));
    });
    return result;
  }

  function clampWeekMonday(monday) {
    if (monday < MIN_WEEK_MONDAY) return new Date(MIN_WEEK_MONDAY);
    if (monday > MAX_WEEK_MONDAY) return new Date(MAX_WEEK_MONDAY);
    return monday;
  }

  let myScheduleWeekMonday = null;

  let noticesData = [
    { id: 1, title: '8월 3주차 시간표 안내', content: '8/18(월)부터 강남학원 고3반 시간이 18:00 → 18:30으로 변경됩니다. 참고 부탁드려요.', date: '8/11', author: '이경근' },
    { id: 2, title: '답안지 수령 후 등록 꼭 부탁드립니다', content: '답안지 받으신 직후 수령 현황에 바로 등록해주세요. 학생 문의가 늘고 있습니다.', date: '8/9', author: '이경근' },
  ];

  let receiptsData = [
    { id: 1, date: '8/14', className: '대치 금6', studentName: '최지우', holder: '정주승', time: '8/14 18:45' },

  // ---------- Screen navigation ----------

  function setActiveNav(id) {
    document.querySelectorAll('.nav-btn').forEach(btn => {

  function goToScreen(id) {

  // ---------- Login ----------
  function updateButtonState() {
    const pinFilled = pinInputs.every(input => input.value.length === 1);
    loginBtn.disabled = !(nameInput.value.trim() && pinFilled);
  }

  nameInput.addEventListener('input', updateButtonState);

  pinInputs.forEach((input, idx) => {
    input.addEventListener('input', () => {
      input.value = input.value.replace(/[^0-9]/g, '');
      if (input.value && idx < pinInputs.length - 1) pinInputs[idx + 1].focus();
      updateButtonState();
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !input.value && idx > 0) pinInputs[idx - 1].focus();
    });
  });

  loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const typedName = nameInput.value.trim();
    if (!typedName) return;
    const match = TEAM_ROSTER.find(person => person.name === typedName);
    if (!match) {
      errorMessage.textContent = '등록되지 않은 이름입니다. 이름을 다시 확인해주세요.';

    editingNoticeId = null;
    receiptClassId = null;
    receiptDateKey = null;

    myScheduleWeekMonday = null;

    receiptsFilterClassId = null;

    errorMessage.textContent = '';

  // ---------- Class cards / calendar ----------
  function formatTeachersHtml(teachers) {
    return teachers
      .map(name => {
        const match = name.match(/^(.*?)\s*\(책임\)\s*$/);
        return match ? `<strong>${match[1]}</strong>` : name;
      })
      .join(', ');
  }

  function buildClassCard(cls, mode, dateObj) {
    const card = document.createElement('div');
    const dateKey = dateObj ? formatDateKey(dateObj) : null;
    const isActive = (mode === 'admin' && editingClassId === cls.id)
      || (mode === 'receipt' && receiptClassId === cls.id && receiptDateKey === dateKey);
    const clickable = mode === 'admin' || mode === 'receipt';
    card.className = 'class-card' + (clickable ? ' class-card--editable' : '') + (isActive ? ' class-card--active' : '');
    const badgeHtml = (mode === 'receipt' && dateObj)
      ? (getReceiptsForClassDate(cls, dateObj).length > 0
          ? '<div class="receipt-status-badge receipt-status-badge--done">입력 완료</div>'
          : '<div class="receipt-status-badge receipt-status-badge--pending">미입력</div>')
      : '';
    card.innerHTML = `
      ${badgeHtml}
      <div class="class-name">${cls.className}</div>
      <div class="class-location">${cls.academy}</div>
      <div class="class-time">${cls.time}</div>
      <div class="class-meta">학생 ${cls.studentCount}명</div>
      <div class="class-teachers">${formatTeachersHtml(cls.teachers)}</div>
    `;
    if (mode === 'admin') {
      card.addEventListener('click', () => {
        editingClassId = (editingClassId === cls.id) ? null : cls.id;
        renderHomeCalendar();
      });
    } else if (mode === 'receipt') {
      card.addEventListener('click', () => {
        if (receiptClassId === cls.id && receiptDateKey === dateKey) {
          receiptClassId = null;
          receiptDateKey = null;
        } else {
          receiptClassId = cls.id;
          receiptDateKey = dateKey;
        }
        justRegisteredNames = [];
        renderMyScheduleCalendar();
      });
    }
    return card;
  }

  function renderWeekCalendar(containerId, classList, mode, weekDates) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    WEEKDAYS.forEach(day => {
      const dayCol = document.createElement('div');
      dayCol.className = 'week-day';

      const dateObj = weekDates ? weekDates[day] : null;

      const header = document.createElement('div');
      header.className = 'week-day-header';
      header.textContent = dateObj ? `${day} ${formatDateLabel(dateObj)}` : day;
      dayCol.appendChild(header);

      const dayClasses = classList.filter(c => c.day === day);
      if (dayClasses.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'week-day-empty';
        empty.textContent = '수업 없음';
        dayCol.appendChild(empty);
      } else {
        dayClasses.forEach(cls => dayCol.appendChild(buildClassCard(cls, mode, dateObj)));
      }

      container.appendChild(dayCol);
    });
  }

  function renderHomeCalendar() {
    const isAdmin = currentUser && currentUser.role === '관리자';
    document.getElementById('homeGreeting').textContent = '이번 주 수업';
    renderWeekCalendar('weekCalendar', classesData, isAdmin ? 'admin' : null);
    renderHomeEditPanel();
  }

  function renderHomeEditPanel() {
    const panel = document.getElementById('homeEditPanel');
    if (editingClassId === null) {
      panel.classList.add('hidden');
      panel.innerHTML = '';
      return;
    }
    const cls = classesData.find(c => c.id === editingClassId);
    if (!cls) {
      panel.classList.add('hidden');
      return;
    }
    panel.classList.remove('hidden');
    panel.innerHTML = `
      <h4>${cls.className} (${cls.academy} · ${cls.time}) 수정</h4>
      <div class="field">
        <label for="editStudentCount">학생 수</label>
        <input type="number" class="search-input" id="editStudentCount" value="${cls.studentCount}">
      </div>
      <div class="field">
        <label for="editTeachers">배정 첨삭진 (쉼표로 구분, 책임 선생님은 이름 뒤에 "(책임)")</label>
        <input type="text" class="search-input" id="editTeachers" value="${cls.teachers.join(', ')}">
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-primary" id="saveClassBtn">저장</button>
        <button type="button" class="btn btn-secondary" id="cancelClassBtn">취소</button>
      </div>
    `;
    panel.querySelector('#saveClassBtn').addEventListener('click', () => saveClassEdit(cls.id));
    panel.querySelector('#cancelClassBtn').addEventListener('click', cancelClassEdit);
  }

  function saveClassEdit(id) {
    const cls = classesData.find(c => c.id === id);
    if (!cls) return;
    const studentCount = parseInt(document.getElementById('editStudentCount').value, 10);
    const teachers = document.getElementById('editTeachers').value
      .split(',')
      .map(t => t.trim())
      .filter(t => t.length > 0);
    if (!isNaN(studentCount)) cls.studentCount = studentCount;
    if (teachers.length > 0) cls.teachers = teachers;
    editingClassId = null;
    renderHomeCalendar();
    if (document.getElementById('screen-my-schedule').classList.contains('active')) {
      renderMyScheduleCalendar();
    }
  }

  function cancelClassEdit() {
    editingClassId = null;
    renderHomeCalendar();
  }

  function renderMyScheduleCalendar() {
    if (!currentUser) return;
    if (!myScheduleWeekMonday) {
      myScheduleWeekMonday = clampWeekMonday(getMondayOfWeek(new Date()));
    }
    const weekDates = buildWeekDates(myScheduleWeekMonday);
    const myClasses = getMyClassesForWeek(weekDates);
    renderMyScheduleWeekNav();
    renderWeekCalendar('myScheduleCalendar', myClasses, 'receipt', weekDates);
    renderMyScheduleReceiptPanel(weekDates);
  }

  function renderMyScheduleWeekNav() {
    const nav = document.getElementById('myScheduleWeekNav');
    const monday = myScheduleWeekMonday;
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    const label = `${formatDateLabel(monday)} - ${formatDateLabel(sunday)}`;
    const prevDisabled = monday <= MIN_WEEK_MONDAY;
    const nextDisabled = monday >= MAX_WEEK_MONDAY;
    nav.innerHTML = `
      <button type="button" class="week-nav-btn" id="prevWeekBtn" ${prevDisabled ? 'disabled' : ''}>◀ 저번주</button>
      <span class="week-nav-label">${label}</span>
      <button type="button" class="week-nav-btn" id="nextWeekBtn" ${nextDisabled ? 'disabled' : ''}>다음주 ▶</button>
    `;
    if (!prevDisabled) nav.querySelector('#prevWeekBtn').addEventListener('click', () => changeWeek(-7));
    if (!nextDisabled) nav.querySelector('#nextWeekBtn').addEventListener('click', () => changeWeek(7));
  }

  function changeWeek(days) {
    const next = new Date(myScheduleWeekMonday);
    next.setDate(next.getDate() + days);
    myScheduleWeekMonday = clampWeekMonday(next);
    receiptClassId = null;
    receiptDateKey = null;
    justRegisteredNames = [];
    renderMyScheduleCalendar();
  }

  function renderMyScheduleReceiptPanel(weekDates) {
    const panel = document.getElementById('myScheduleReceiptPanel');
    if (receiptClassId === null) {
      panel.classList.add('hidden');
      panel.innerHTML = '';
      return;
    }
    const cls = findClassById(receiptClassId);
    weekDates = weekDates || buildWeekDates(myScheduleWeekMonday);
    const dateObj = cls ? weekDates[cls.day] : null;
    if (!cls || !dateObj || formatDateKey(dateObj) !== receiptDateKey) {
      panel.classList.add('hidden');
      return;
    }
    panel.classList.remove('hidden');

    const existing = getReceiptsForClassDate(cls, dateObj);
    const existingHtml = existing.map(r => `
      <div class="receipt-row" data-id="${r.id}">
        <span class="receipt-row-name">${r.studentName}</span>
        <span class="receipt-row-meta">${r.holder} · ${r.time}</span>
        <button type="button" class="receipt-row-remove" data-id="${r.id}" aria-label="삭제">×</button>
      </div>
    `).join('');

    const registeredHtml = justRegisteredNames.length > 0
      ? `<p class="subtitle" style="margin-top: var(--spacing-sm);">방금 등록됨: ${justRegisteredNames.join(', ')}</p>`
      : '';

    panel.innerHTML = `
      <h4>${formatDateLabel(dateObj)}(${cls.day}) ${cls.className} 답안 수령 기록</h4>
      ${existing.length > 0 ? `
        <div class="field">
          <label>등록된 학생 (${existing.length}명)</label>
          ${existingHtml}
        </div>
      ` : ''}
      <div class="field">
        <label for="receiptStudentNames">${existing.length > 0 ? '학생 이름 추가' : '학생 이름'} (여러 명, 띄어쓰기로 구분)</label>
        <input type="text" class="search-input" id="receiptStudentNames" placeholder="예: 홍길동 김철수 이영희" autocomplete="off">
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-primary" id="registerReceiptBtn">등록</button>
        <button type="button" class="btn btn-secondary" id="cancelReceiptBtn">닫기</button>
      </div>
      <button type="button" class="btn btn-secondary" id="viewInReceiptsBtn">수령 현황 탭에서 보기</button>
      ${registeredHtml}
    `;
    panel.querySelector('#registerReceiptBtn').addEventListener('click', () => registerReceipt(cls, dateObj));
    panel.querySelector('#cancelReceiptBtn').addEventListener('click', () => {
      receiptClassId = null;
      receiptDateKey = null;
      justRegisteredNames = [];
      renderMyScheduleCalendar();
    });
    panel.querySelector('#viewInReceiptsBtn').addEventListener('click', () => {
      receiptsFilterDateValue = formatDateKey(dateObj);
      receiptsFilterClassId = cls.id;
      receiptsSearchQuery = '';
      goToScreen('screen-receipts');
    });
    panel.querySelectorAll('.receipt-row-remove').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = parseInt(btn.dataset.id, 10);
        receiptsData = receiptsData.filter(r => r.id !== id);
        renderMyScheduleCalendar();
      });
    });
  }

  function registerReceipt(cls, dateObj) {
    const input = document.getElementById('receiptStudentNames');
    const names = input.value.trim().split(/\s+/).filter(Boolean);
    if (names.length === 0) return;
    const timestamp = formatTimestampLabel(new Date());
    names.forEach(name => {
      receiptIdCounter++;
      receiptsData.push({
        id: receiptIdCounter,
        date: formatDateLabel(dateObj),
        className: cls.className,
        studentName: name,
        holder: currentUser.name,
        time: timestamp,
      });
    });
    justRegisteredNames = names;
    renderMyScheduleCalendar();
  }

  // ---------- Notices ----------
  document.getElementById('addNoticeBtn').addEventListener('click', addNotice);

  function addNotice() {
    const title = document.getElementById('noticeTitleInput').value.trim();
    const content = document.getElementById('noticeContentInput').value.trim();
    if (!title || !content) return;
    noticeIdCounter++;
    noticesData.push({ id: noticeIdCounter, title, content, date: '방금 등록', author: currentUser.name });
    document.getElementById('noticeTitleInput').value = '';
    document.getElementById('noticeContentInput').value = '';
    renderNoticeList();
  }

  function renderNoticeList() {
    const isAdmin = currentUser && currentUser.role === '관리자';
    noticeForm.classList.toggle('hidden', !isAdmin);

    const container = document.getElementById('noticeListContainer');
    container.innerHTML = '';

    if (noticesData.length === 0) {
      container.innerHTML = '<p class="subtitle">등록된 공지사항이 없습니다.</p>';
      return;
    }

    noticesData
      .slice()
      .sort((a, b) => b.id - a.id)
      .forEach(notice => {
        const item = (isAdmin && editingNoticeId === notice.id)
          ? buildNoticeEditItem(notice)
          : buildNoticeViewItem(notice, isAdmin);
        container.appendChild(item);
      });
  }

  function buildNoticeViewItem(notice, isAdmin) {
    const item = document.createElement('div');
    item.className = 'notice-item';
    item.innerHTML = `
      <h4>${notice.title}</h4>
      <p>${notice.content}</p>
      <div class="notice-meta">${notice.date} · ${notice.author}</div>
    `;

    if (isAdmin) {
      const actions = document.createElement('div');
      actions.className = 'notice-actions';
      actions.innerHTML = `
        <button type="button" class="btn btn-secondary">수정</button>
        <button type="button" class="btn btn-secondary">삭제</button>
      `;
      const [editBtn, deleteBtn] = actions.querySelectorAll('button');
      editBtn.addEventListener('click', () => {
        editingNoticeId = notice.id;
        renderNoticeList();
      });
      deleteBtn.addEventListener('click', () => {
        if (!confirm('이 공지사항을 삭제할까요?')) return;
        noticesData = noticesData.filter(n => n.id !== notice.id);
        renderNoticeList();
      });
      item.appendChild(actions);
    }

    return item;
  }

  function buildNoticeEditItem(notice) {
    const item = document.createElement('div');
    item.className = 'notice-item';
    item.innerHTML = `
      <div class="field">
        <label for="editNoticeTitle">제목</label>
        <input type="text" class="search-input" id="editNoticeTitle" value="${notice.title}">
      </div>
      <div class="field">
        <label for="editNoticeContent">내용</label>
        <textarea class="search-input" id="editNoticeContent">${notice.content}</textarea>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-primary" id="saveNoticeBtn">저장</button>
        <button type="button" class="btn btn-secondary" id="cancelNoticeBtn">취소</button>
      </div>
    `;
    item.querySelector('#saveNoticeBtn').addEventListener('click', () => saveNoticeEdit(notice.id));
    item.querySelector('#cancelNoticeBtn').addEventListener('click', () => {
      editingNoticeId = null;
      renderNoticeList();
    });
    return item;
  }

  function saveNoticeEdit(id) {
    const notice = noticesData.find(n => n.id === id);
    if (!notice) return;

    const title = document.getElementById('editNoticeTitle').value.trim();
    const content = document.getElementById('editNoticeContent').value.trim();
    if (!title || !content) return;

    notice.title = title;
    notice.content = content;
    editingNoticeId = null;
    renderNoticeList();
  }

  // ---------- Receipts ----------
  const receiptDateSelect = document.getElementById('receiptDateSelect');
  const receiptClassSelect = document.getElementById('receiptClassSelect');
  const receiptSearchInput = document.getElementById('receiptSearchInput');

  receiptDateSelect.min = formatDateKey(SCHEDULE_MIN_DATE);
  receiptDateSelect.max = formatDateKey(SCHEDULE_MAX_DATE);

  receiptDateSelect.addEventListener('change', () => {
    receiptsFilterDateValue = receiptDateSelect.value;
    receiptsFilterClassId = null;
    renderReceipts();
  });

  receiptClassSelect.addEventListener('change', () => {
    receiptsFilterClassId = receiptClassSelect.value ? parseInt(receiptClassSelect.value, 10) : null;
    renderReceiptsTable();
  });

  receiptSearchInput.addEventListener('input', () => {
    receiptsSearchQuery = receiptSearchInput.value.trim();
    renderReceiptsTable();
  });

  function populateReceiptClassOptions(dateObj) {
    if (!dateObj) {
      receiptClassSelect.innerHTML = '<option value="">날짜를 먼저 선택하세요</option>';
      receiptClassSelect.disabled = true;
      return;
    }
    const dayLabel = weekdayLabelOf(dateObj);
    const source = dateObj < SCHEDULE_SPLIT_DATE ? classesData15ch : classesData;
    const options = source.filter(c => c.day === dayLabel);
    if (options.length === 0) {
      receiptClassSelect.innerHTML = '<option value="">해당 날짜에 수업이 없습니다</option>';
      receiptClassSelect.disabled = true;
      return;
    }
    receiptClassSelect.disabled = false;
    receiptClassSelect.innerHTML = '<option value="">수업을 선택하세요</option>'
      + options.map(c => `<option value="${c.id}">${c.className} (${c.time})</option>`).join('');
  }

  function renderReceipts() {
    receiptDateSelect.value = receiptsFilterDateValue;
    const dateObj = receiptsFilterDateValue ? parseDateInputValue(receiptsFilterDateValue) : null;
    populateReceiptClassOptions(dateObj);
    if (receiptsFilterClassId !== null) {
      receiptClassSelect.value = String(receiptsFilterClassId);
    }
    receiptSearchInput.value = receiptsSearchQuery;
    renderReceiptsTable();
  }

  function renderReceiptsTable() {
    const container = document.getElementById('receiptsContainer');
    if (!receiptsFilterDateValue || receiptsFilterClassId === null) {
      container.innerHTML = '<p class="subtitle">날짜와 수업을 선택하면 수령 기록을 볼 수 있습니다.</p>';
      return;
    }
    const cls = findClassById(receiptsFilterClassId);
    const dateObj = parseDateInputValue(receiptsFilterDateValue);
    let records = getReceiptsForClassDate(cls, dateObj);
    if (receiptsSearchQuery) {
      records = records.filter(r => r.studentName.includes(receiptsSearchQuery));
    }
    if (records.length === 0) {
      container.innerHTML = '<p class="subtitle">등록된 수령 기록이 없습니다.</p>';
      return;
    }
    const rows = records.map(r => `
      <tr>
        <td>${r.studentName}</td>
        <td>${r.holder}</td>
        <td>${r.time}</td>
      </tr>
    `).join('');
    container.innerHTML = `
      <table class="receipt-table">
        <thead>
          <tr><th>학생</th><th>가져간 첨삭진</th><th>등록 시각</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }
</script>
</body>
</html>
